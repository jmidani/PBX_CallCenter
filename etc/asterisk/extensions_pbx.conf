; ===== Owner: Student C. PBX roles and permissions =====

[do-dial]
exten => _X.,1,GotoIf($["${DB(config/record_internal)}"="1"]?rec:dial)
 same => n(rec),MixMonitor(/var/spool/asterisk/monitor/int-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n(dial),Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

[dial-staff]
exten => _10XX,1,Goto(do-dial,${EXTEN},1)
exten => _110[0-2],1,Goto(do-dial,${EXTEN},1)
exten => _[23]00X,1,Goto(do-dial,${EXTEN},1)
exten => _400[1-3],1,Goto(do-dial,${EXTEN},1)
exten => 4000,1,Dial(PJSIP/4001&PJSIP/4002&PJSIP/4003,30,tT)

[dial-ceo]
exten => 9000,1,Goto(do-dial,9000,1)

[deny-ceo]
exten => 9000,1,Playback(ss-noservice)
 same => n,Hangup()

[from-external]
exten => 8000,1,Goto(ivr-main,s,1)

[from-employee]
include => deny-ceo
include => dial-staff

[from-teller]
include => deny-ceo
include => dial-staff

[from-supervisor]
include => deny-ceo
include => dial-staff

[from-manager]
include => dial-staff
include => dial-ceo
include => manager-features

[from-ceo]
include => dial-staff
include => dial-ceo

[transfer-teller]
exten => 4000,1,Dial(PJSIP/4001&PJSIP/4002&PJSIP/4003,30,tT)
exten => 1000,1,Dial(PJSIP/1000,30,tT)
exten => _110[0-2],1,Dial(PJSIP/${EXTEN},30,tT)

[manager-features]
exten => *98,1,Answer()
 same => n,GotoIf($["${DB(config/record_internal)}"="1"]?off)
 same => n,Set(DB(config/record_internal)=1)
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(off),Set(DB(config/record_internal)=0)
 same => n,Playback(beep&beep)
 same => n,Hangup()
