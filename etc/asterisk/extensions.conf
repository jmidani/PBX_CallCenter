[test-tools]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => 601,1,Answer()
 same => n,Gosub(start-recording,s,1)
same => n,Echo()
exten => 602,1,Answer()
 same => n,Set(SPYGROUP=tellers)
 same => n,Echo()

[from-external]
include => test-tools

[from-teller]
include => test-tools

[from-manager]
include => test-tools



[from-supervisor]
include => test-tools

[from-employee]
include => test-tools

[from-ceo]
include => test-tools

[general]
static=yes
writeprotect=yes

[queue-entry]
exten => s,1,NoOp(Queue entry: SERVICE=${SERVICE} QNAME=${QNAME} LANG=${CUST_LANG})
 same => n,GotoIf($["${QNAME}"=""]?noqueue)
 same => n,GotoIf($["${SERVICE}"="cards"]?prio)
 same => n,GotoIf($["${CUST_ID}"=""]?join)
 same => n,GotoIf($[${QUEUE_WAITING_COUNT(${QNAME})}<2 & ${QUEUE_MEMBER(${QNAME},ready)}>0]?join)
 same => n,Gosub(callback-request,s,1)
 same => n,Goto(join)
 same => n(prio),Set(QUEUE_PRIO=10)
 same => n(join),Playback(bank/please-hold)
 same => n,Queue(${QNAME},t,,,300,,teller-gosub)
 same => n(noqueue),Playback(bank/goodbye)
 same => n,Hangup()

[start-recording]
; (A calls Gosub(start-recording,s,1) right after Answer())
exten => s,1,Set(REC=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}-${CALLERID(num)}.wav)
 same => n,MixMonitor(${REC})
 same => n,Set(CDR(recordingfile)=${REC})
 same => n,Return()

[teller-gosub]
exten => s,1,Set(SPYGROUP=tellers)
 same => n,Set(__TRANSFER_CONTEXT=transfer-teller)
 same => n,Set(MASTER_CHANNEL(ANSWERED)=1)
 same => n,Set(MASTER_CHANNEL(AGENT_EXT)=${CUT(CUT(CHANNEL,/,2),-,1)})
 same => n,Return()


#include extensions_pbx.conf
[ivr-main]
exten => 8000,1,Answer()
 same => n,Gosub(start-recording,s,1)
 same => n,Set(CHANNEL(hangup_handler_push)=post-call,s,1)
 same => n,Set(LTRIES=0)
 same => n(lang),Read(LANGCHOICE,bank/lang-select,1,,1,5)
 same => n,GotoIf($["${LANGCHOICE}"="1"]?en)
 same => n,GotoIf($["${LANGCHOICE}"="2"]?ar)
 same => n,GotoIf($["${LANGCHOICE}"="3"]?fr)
 same => n,Set(LTRIES=$[${LTRIES}+1])
 same => n,GotoIf($[${LTRIES}>=3]?bye)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(lang)
 same => n(en),Set(CUST_LANG=en)
 same => n,Goto(setlang)
 same => n(ar),Set(CUST_LANG=ar)
 same => n,Goto(setlang)
 same => n(fr),Set(CUST_LANG=fr)
  same => n(setlang),Set(CHANNEL(language)=${CUST_LANG})
 same => n,Playback(bank/recording-notice)
 same => n,Set(CTRIES=0)
 same => n(custread),Read(ISCUST,bank/cust-or-not,1,,1,5)
 same => n,GotoIf($["${ISCUST}"="2"]?prospect)
 same => n,GotoIf($["${ISCUST}"="1"]?customer)
 same => n,GotoIf($["${ISCUST}"=""]?lang)
 same => n,Set(CTRIES=$[${CTRIES}+1])
 same => n,GotoIf($[${CTRIES}>=3]?bye)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(custread)
 same => n(prospect),Set(SERVICE=prospect)
 same => n,Set(SURVEY_OPT=0)
 same => n,Set(QNAME=prospects)
 same => n,Goto(queue-entry,s,1)
  same => n(customer),Set(TRIES=0)
 same => n(login),Read(CARD,bank/enter-card,16,,1,10)
 same => n,Read(PIN,bank/enter-pin,4,,1,10)
 same => n,Set(CARD=${FILTER(0-9,${CARD})})
 same => n,Set(PIN=${FILTER(0-9,${PIN})})
 same => n,Set(RES=${ODBC_BANK_AUTH(${CARD},${PIN})})
 same => n,GotoIf($["${RES}"=""]?badlogin)
 same => n,Set(CUST_ID=${CUT(RES,\,,1)})
 same => n,Set(CUST_NAME=${CUT(RES,\,,2)})
 same => n,Set(CUST_STATUS=${CUT(RES,\,,3)})
 same => n,GotoIf($["${CUST_STATUS}"!="active"]?blocked)
 same => n,Goto(menu)
 same => n(badlogin),Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES}>=3]?bye)
 same => n,Playback(bank/invalid-login)
 same => n,Goto(login)
 same => n(blocked),Playback(bank/account-blocked)
 same => n,Hangup()
  same => n(menu),Set(MTRIES=0)
 same => n(menuread),Read(CHOICE,bank/main-menu,1,,1,5)
 same => n,GotoIf($["${CHOICE}"="1"]?balance)
 same => n,GotoIf($["${CHOICE}"="2"]?faq)
 same => n,GotoIf($["${CHOICE}"="3"]?teller)
 same => n,Set(MTRIES=$[${MTRIES}+1])
 same => n,GotoIf($[${MTRIES}>=3]?bye)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(menuread)
  same => n(balance),Set(BAL=${ODBC_BALANCE(${CUST_ID})})
 same => n,NoOp(Balance for ${CUST_NAME}: ${BAL})
 same => n,Playback(bank/your-balance-is)
 same => n,Set(WHOLE=${CUT(BAL,.,1)})
 same => n,Set(I=0)
 same => n(digitloop),GotoIf($[${I}>=${LEN(${WHOLE})}]?digitsdone)
 same => n,Playback(bank/digit-${WHOLE:${I}:1})
 same => n,Set(I=$[${I}+1])
 same => n,Goto(digitloop)
 same => n(digitsdone),Playback(bank/currency-egp)
 same => n,Goto(menuread)
  same => n(faq),Set(FTRIES=0)
 same => n(faqread),Read(FAQCHOICE,bank/faq-menu,1,,1,5)
 same => n,GotoIf($["${FAQCHOICE}"="1"]?faq1)
 same => n,GotoIf($["${FAQCHOICE}"="2"]?faq2)
 same => n,GotoIf($["${FAQCHOICE}"="3"]?faq3)
 same => n,GotoIf($["${FAQCHOICE}"="*"]?faqread)
 same => n,GotoIf($["${FAQCHOICE}"=""]?menuread)
 same => n,Set(FTRIES=$[${FTRIES}+1])
 same => n,GotoIf($[${FTRIES}>=3]?menuread)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(faqread)
 same => n(faq1),NoOp(FAQ: how to change PIN)
 same => n,Playback(bank/faq-change-pin)
 same => n,Goto(resolved)
 same => n(faq2),NoOp(FAQ: how to change phone number)
 same => n,Playback(bank/faq-change-phone)
 same => n,Goto(resolved)
 same => n(faq3),NoOp(FAQ: how to close account)
 same => n,Playback(bank/faq-close-account)
 same => n,Goto(resolved)
 same => n(resolved),Set(RTRIES=0)
 same => n(resread),Read(RESOLVEDCHOICE,bank/resolved-question,1,,1,5)
 same => n,GotoIf($["${RESOLVEDCHOICE}"="1"]?menuread)
 same => n,GotoIf($["${RESOLVEDCHOICE}"="2"]?teller)
 same => n,Set(RTRIES=$[${RTRIES}+1])
 same => n,GotoIf($[${RTRIES}>=3]?teller)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(resread)
  same => n(teller),Set(STRIES=0)
 same => n(svcread),Read(SVC,bank/service-menu,1,,1,5)
 same => n,GotoIf($["${SVC}"="1"]?retail)
 same => n,GotoIf($["${SVC}"="2"]?corporate)
 same => n,GotoIf($["${SVC}"="3"]?cards)
 same => n,GotoIf($["${SVC}"=""]?menuread)
 same => n,Set(STRIES=$[${STRIES}+1])
 same => n,GotoIf($[${STRIES}>=3]?bye)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(svcread)
 same => n(retail),Set(SERVICE=retail)
 same => n,Set(QNAME=retail)
 same => n,Goto(handoff)
 same => n(corporate),Set(SERVICE=corporate)
 same => n,Set(QNAME=corporate)
 same => n,Goto(handoff)
 same => n(cards),Set(SERVICE=cards)
 same => n,Set(QNAME=cards)
 same => n(handoff),Set(CUST_PHONE=${ODBC_CUSTPHONE(${CUST_ID})})
 same => n,Read(SURVEYCHOICE,bank/survey-optin,1,,1,5)
 same => n,Set(SURVEY_OPT=$["${SURVEYCHOICE}"="1" ? 1 :: 0])
 same => n,Goto(queue-entry,s,1)
 same => n(bye),Playback(bank/goodbye)
 same => n,Hangup()


[agent-codes]
exten => *45,1,Answer()
 same => n,Set(EXT=${CALLERID(num)})
 same => n,GotoIf($[${EXT}>=1001 & ${EXT}<=1005]?retail)
 same => n,GotoIf($[${EXT}>=1011 & ${EXT}<=1015]?corporate)
 same => n,GotoIf($[${EXT}>=1021 & ${EXT}<=1022]?cards)
 same => n,GotoIf($[${EXT}>=1031 & ${EXT}<=1033]?prospects)
 same => n,Hangup()
 same => n(retail),AddQueueMember(retail,PJSIP/${EXT},0)
 same => n,Goto(done)
 same => n(corporate),AddQueueMember(corporate,PJSIP/${EXT},0)
 same => n,Goto(done)
 same => n(cards),AddQueueMember(cards,PJSIP/${EXT},0)
 same => n,Goto(done)
 same => n(prospects),AddQueueMember(prospects,PJSIP/${EXT},0)
 same => n(done),Playback(agent-loginok)
 same => n,Hangup()

exten => *46,1,Answer()
 same => n,Set(EXT=${CALLERID(num)})
 same => n,RemoveQueueMember(retail,PJSIP/${EXT})
 same => n,RemoveQueueMember(corporate,PJSIP/${EXT})
 same => n,RemoveQueueMember(cards,PJSIP/${EXT})
 same => n,RemoveQueueMember(prospects,PJSIP/${EXT})
 same => n,Playback(agent-loggedoff)
 same => n,Hangup()

[test-survey]
exten => s,1,Set(ODBC_SURVEY_SAVE(TESTCALL,1001,1)=5)
 same => n,Hangup()

[survey]
exten => s,1,Answer()
 same => n,Set(CHANNEL(language)=${SLANG})
 same => n,Set(SURVTRIES=0)
 same => n(ask),Read(RATING,bank/survey-rate,1,,1,8)
 same => n,GotoIf($[${REGEX("^[1-5]$" ${RATING})}]?save)
 same => n,Set(SURVTRIES=$[${SURVTRIES}+1])
 same => n,GotoIf($[${SURVTRIES}>=2]?end)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(ask)
 same => n(save),Set(ODBC_SURVEY_SAVE(${CALLID},${AGENT},${CUSTID})=${RATING})
 same => n,Playback(bank/survey-thanks)
 same => n(end),Hangup()

[post-call]
exten => s,1,NoOp(post-call: OPT=${SURVEY_OPT} ANSWERED=${ANSWERED} AGENT=${AGENT_EXT})
 same => n,GotoIf($["${SURVEY_OPT}"!="1"]?end)
 same => n,GotoIf($["${ANSWERED}"!="1"]?end)
 same => n,System(/usr/local/bin/make-survey-call.sh ${CUST_PHONE} ${CUST_LANG} ${AGENT_EXT} ${CUST_ID} ${UNIQUEID})
 same => n(end),Return()

[test-cb]
exten => s,1,Set(ODBC_CB_SAVE(1,retail,en)=01001110002)
 same => n,Set(LAST=${ODBC_CB_LASTID(1)})
 same => n,NoOp(last callback id ${LAST})
 same => n,Set(ODBC_CB_STATUS(${LAST})=done)
 same => n,Hangup()

[callback-request]
exten => s,1,Set(CBT=0)
 same => n,Read(CBCHOICE,bank/cb-offer,1,,1,5)
 same => n,GotoIf($["${CBCHOICE}"!="1"]?nocb)
 same => n(which),Read(CBSEL,bank/cb-which-number,1,,1,5)
 same => n,GotoIf($["${CBSEL}"="1"]?stored)
 same => n,GotoIf($["${CBSEL}"="2"]?alt)
 same => n,Set(CBT=$[${CBT}+1])
 same => n,GotoIf($[${CBT}>=3]?nocb)
 same => n,Playback(bank/invalid-choice)
 same => n,Goto(which)
 same => n(stored),Set(CBNUM=${CUST_PHONE})
 same => n,Goto(confirm)
 same => n(alt),Read(ALTNUM,bank/cb-enter-number,15,,1,15)
 same => n,Set(CBNUM=${FILTER(0-9,${ALTNUM})})
 same => n,GotoIf($[${REGEX("^[0-9]{8,15}$" ${CBNUM})}]?confirm)
 same => n,Set(CBT=$[${CBT}+1])
 same => n,GotoIf($[${CBT}>=3]?nocb)
 same => n,Playback(bank/cb-invalid-number)
 same => n,Goto(alt)
 same => n(confirm),Playback(bank/cb-you-entered)
 same => n,SayDigits(${CBNUM})
 same => n,Read(CBCONF,bank/cb-confirm,1,,1,5)
 same => n,GotoIf($["${CBCONF}"="1"]?save)
 same => n,Set(CBT=$[${CBT}+1])
 same => n,GotoIf($[${CBT}>=3]?nocb)
 same => n,Goto(which)
 same => n(save),Set(ODBC_CB_SAVE(${CUST_ID},${QNAME},${CUST_LANG})=${CBNUM})
 same => n,Playback(bank/cb-saved)
 same => n,Hangup()
 same => n(nocb),Return()

[cb-answer]
exten => s,1,Answer()
 same => n,Gosub(start-recording,s,1)
 same => n,Set(CHANNEL(language)=${SLANG})
 same => n,Set(ODBC_CB_STATUS(${CBID})=answered)
 same => n,Playback(bank/cb-greeting)
 same => n,Set(QUEUE_PRIO=5)
 same => n,Queue(${QNAME},t,,,300,,teller-gosub)
 same => n,Set(ODBC_CB_STATUS(${CBID})=done)
 same => n,Hangup()
