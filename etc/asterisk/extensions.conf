[test-tools]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _XXXX,1,Dial(PJSIP/${EXTEN},20)

[from-external]
include => test-tools

[from-teller]
include => test-tools

[from-manager]
include => test-tools

[from-supervisor]
include => test-tools

[from-employee]
include => test-tools

[from-ceo]
include => test-tools

[general]
static=yes
writeprotect=yes

[queue-entry]
exten => s,1,Playback(beep)
 same => n,Return()

[start-recording]
exten => s,1,Return()

[teller-gosub]
exten => s,1,Set(SPYGROUP=tellers)
 same => n,Set(__TRANSFER_CONTEXT=transfer-teller)
 same => n,Return()

