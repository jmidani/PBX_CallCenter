[test-tools]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => 601,1,Answer()
 same => n,Gosub(start-recording,s,1)
 same => n,Echo()
exten => 602,1,Answer()
 same => n,Set(SPYGROUP=tellers)
 same => n,Echo()

[from-external]
include => test-tools

[from-teller]
include => test-tools

[from-manager]
include => test-tools

[from-supervisor]
include => test-tools

[from-employee]
include => test-tools

[from-ceo]
include => test-tools

[general]
static=yes
writeprotect=yes

[queue-entry]
exten => s,1,Playback(beep)
 same => n,Return()

[start-recording]
; (A calls Gosub(start-recording,s,1) right after Answer())
exten => s,1,Set(REC=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}-${CALLERID(num)}.wav)
 same => n,MixMonitor(${REC})
 same => n,Set(CDR(recordingfile)=${REC})
 same => n,Return()

[teller-gosub]
exten => s,1,Set(SPYGROUP=tellers)
 same => n,Set(__TRANSFER_CONTEXT=transfer-teller)
 same => n,Return()


#include extensions_pbx.conf
