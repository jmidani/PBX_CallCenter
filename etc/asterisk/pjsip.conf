[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ===== AUTHENTICATION TEMPLATE =====

[auth-tpl](!)
type=auth
auth_type=userpass

; ===== AOR TEMPLATE =====

[aor-tpl](!)
type=aor
max_contacts=1

; ===== PROSPECT TEMPLATE =====

[prospect-tpl](!)
type=endpoint
context=from-teller
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ===== TELLER TEMPLATE =====

[teller-tpl](!)
type=endpoint
context=from-teller
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

